# https://firebase.google.com/docs/app-hosting/configure
runConfig:
  # Keep one warm instance so the first visitor after idle is not a cold start.
  # App Hosting applies this at the Cloud Run service (run.googleapis.com/minScale).
  minInstances: 1
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://stdops.studio
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: stdops-af357
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: stdops-af357.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_GA_MEASUREMENT_ID
    value: G-1YS57ZNCJX
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: stdops-af357.firebaseapp.com
    availability: [BUILD, RUNTIME]
  # Public Web-app identifiers (also shipped in the browser bundle). Not secrets.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyA0A1N_aTYMsflxAl0nPCKSy7iModilYe0
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:268288166156:web:e45864db7bf5d59450a129
    availability: [BUILD, RUNTIME]
  # Server-only allowlist. Create with: firebase apphosting:secrets:set ADMIN_ALLOWED_EMAILS
  - variable: ADMIN_ALLOWED_EMAILS
    secret: ADMIN_ALLOWED_EMAILS
    availability: [RUNTIME]
  # Personal LINE ID until the Official Account exists. Swap this for
  # https://lin.ee/… or https://line.me/R/ti/p/@… when the business OA is ready.
  - variable: NEXT_PUBLIC_LINE_ADD_FRIEND_URL
    value: https://line.me/ti/p/~patosorio.88
    availability: [BUILD, RUNTIME]
  # Optional later:
  #   NEXT_PUBLIC_MESSENGER_URL            — Messenger https link
  #   NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION — Search Console HTML-tag `content=`
  # Never put a Firebase service-account JSON here. App Hosting uses ADC.
  # Other secrets: `firebase apphosting:secrets:set <NAME>` then `secret: <NAME>`.
